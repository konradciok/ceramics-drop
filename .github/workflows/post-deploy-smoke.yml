name: post-deploy-smoke

# Prod deploys via Cloudflare Workers Builds, not Actions, so the signed-route
# smoke runs as a SEPARATE workflow (manual + scheduled), not a CI step. It
# HEADs a freshly minted signed /api/print-assets/[id] URL against the live
# origin. Pre-launch (--allow-missing) it skips green when no sellable asset
# exists; once an asset is `ready`/`retired`, a non-200 HEAD fails the run.
#
# ⚠️ This workflow needs SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and
# PRINT_ASSET_TOKEN_SECRET as GitHub repo secrets — a second copy of those
# credentials. Prefer the narrowest viable Supabase key, keep this on the
# default branch, and keep the schedule infrequent until the gate is real.
on:
  workflow_dispatch:
  schedule:
    # Daily ~06:17 UTC (off the :00 fleet). Pre-launch this is a green skip.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  print-asset-smoke:
    name: Print-asset signed-route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Smoke (signed print-asset HEAD)
        run: npm run print-asset:smoke -- --origin https://anna-ciok.studio --json --allow-missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRINT_ASSET_TOKEN_SECRET: ${{ secrets.PRINT_ASSET_TOKEN_SECRET }}
