name: post-deploy-smoke

# Prod deploys via Cloudflare Workers Builds, not Actions, so the signed-route
# smoke runs as a SEPARATE workflow (manual + scheduled), not a CI step. It
# HEADs a freshly minted signed /api/print-assets/[id] URL against the live
# origin. Pre-launch (PRINT_SMOKE_STRICT unset) it skips green when no sellable asset
# exists; set PRINT_SMOKE_STRICT=true after first publish so a missing asset fails.
#
# ⚠️ This workflow needs SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and
# PRINT_ASSET_TOKEN_SECRET as GitHub repo secrets — a second copy of those
# credentials. Prefer the narrowest viable Supabase key, keep this on the
# default branch, and keep the schedule infrequent until the gate is real.
on:
  # (workflow_dispatch takes no branch filter — the job-level default-branch
  # `if` below is the real guard.)
  workflow_dispatch:
  schedule:
    # Daily ~06:17 UTC (off the :00 fleet). Pre-launch this is a green skip.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  homepage-smoke:
    if: github.ref_name == github.event.repository.default_branch
    name: Storefront homepage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Guards the one failure mode CI structurally cannot catch: a Turbopack
      # build succeeds in CI but ChunkLoadErrors at the Workers runtime →
      # HTTP 500 on every page (see AGENTS.md § Build system). Cloudflare bot
      # management may challenge runner IPs (403/503 with a cf-mitigated
      # header), so only an UNmitigated 5xx fails the job.
      - name: Probe homepage
        run: |
          code=$(curl -sS -D /tmp/headers.txt -o /tmp/home.html \
            -w '%{http_code}' --max-time 30 https://anna-ciok.studio/ || echo 000)
          echo "HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::error::Homepage unreachable (curl failed)"; exit 1
          fi
          if [ "$code" -ge 500 ] && ! grep -qi '^cf-mitigated:' /tmp/headers.txt; then
            echo "::error::Homepage returned HTTP $code (not a Cloudflare challenge) — possible broken deploy (Turbopack chunks?)"
            exit 1
          fi
          if [ "$code" = "200" ] && ! grep -q 'lang="pl"' /tmp/home.html; then
            echo "::warning::Homepage 200 but the lang=\"pl\" marker is missing — check the deploy"
          fi

  print-asset-smoke:
    if: github.ref_name == github.event.repository.default_branch
    name: Print-asset signed-route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Smoke (signed print-asset HEAD)
        # Pre-launch: repo variable PRINT_SMOKE_STRICT unset/false → --allow-missing.
        # After first ready asset: set PRINT_SMOKE_STRICT=true so a missing asset fails.
        run: |
          EXTRA=()
          if [ "${{ vars.PRINT_SMOKE_STRICT }}" != "true" ]; then
            EXTRA+=(--allow-missing)
          fi
          npm run print-asset:smoke -- --origin https://anna-ciok.studio --json "${EXTRA[@]}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRINT_ASSET_TOKEN_SECRET: ${{ secrets.PRINT_ASSET_TOKEN_SECRET }}
