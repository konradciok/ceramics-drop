name: E2E

# No paths-ignore here: this workflow is a REQUIRED check on main — filtering
# paths would leave docs-only PRs stuck on "Expected" forever. Minutes are
# unlimited on a public repo, so running on every PR costs nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright @ci specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser binaries keyed on the installed Playwright version —
      # `playwright install` re-downloads ~150 MB per run otherwise. OS deps
      # (install-deps) are not cacheable, so they install on every run.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Build the app once so Playwright's webServer can `next start` it locally.
      # The @ci specs are client-UX assertions (mocked /api/checkout, blocked
      # Geowidget assets); they need the app served, not real backends. A
      # backendless server degrades to "all available" (getSoldIds catches and
      # returns []), which still gives the specs unsold tiles to pick.
      - name: Build app (hermetic)
        run: npm run build
        env:
          # Any non-empty token makes GeowidgetPicker mount the element instead of
          # the missing-token fallback; no real points lookup happens in @ci.
          NEXT_PUBLIC_INPOST_GEOWIDGET_TOKEN: e2e-placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_e2e_placeholder

      - name: Run @ci e2e tests
        run: npm run test:e2e
        env:
          # Hermetic local target — CI pre-builds above; webServer only starts the
          # app (webServer in playwright.config.ts auto-builds on cold local runs).
          # Avoids hitting the Cloudflare-fronted prod host, which serves CI runner
          # IPs a bot-challenge page (no product tiles).
          # Override with the PLAYWRIGHT_BASE_URL var to point at a real deploy.
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
