name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright @ci specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Build the app once so Playwright's webServer can `next start` it locally.
      # The @ci specs are client-UX assertions (mocked /api/checkout, blocked
      # Geowidget assets); they need the app served, not real backends. A
      # backendless server degrades to "all available" (getSoldIds catches and
      # returns []), which still gives the specs unsold tiles to pick.
      - name: Build app (hermetic)
        run: npm run build
        env:
          # Any non-empty token makes GeowidgetPicker mount the element instead of
          # the missing-token fallback; no real points lookup happens in @ci.
          NEXT_PUBLIC_INPOST_GEOWIDGET_TOKEN: e2e-placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_e2e_placeholder

      - name: Run @ci e2e tests
        run: npm run test:e2e
        env:
          # Hermetic local target — CI pre-builds above; webServer only starts the
          # app (webServer in playwright.config.ts auto-builds on cold local runs).
          # Avoids hitting the Cloudflare-fronted prod host, which serves CI runner
          # IPs a bot-challenge page (no product tiles).
          # Override with the PLAYWRIGHT_BASE_URL var to point at a real deploy.
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
